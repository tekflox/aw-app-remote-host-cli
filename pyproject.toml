[tool.ruff]
line-length = 100
target-version = "py311"  # Tier A CI runs Python 3.11 (docs/standards/pipeline-testing.md §1.4)

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]

[tool.pylint.main]
py-version = "3.11"
# The blocking E-class gate (--disable=all --enable=E --disable=E0401,E1101)
# lives on the hook/CI command line, not here — see aw-app-template.

[tool.coverage.run]
source = ["remote_host_cli_app"]
omit = ["*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "if __name__ == .__main__",
    "raise NotImplementedError",
    "pass",
    "except ImportError",
]
show_missing = true
precision = 1
# One-way ratchet per §4.2: measured baseline 2026-11-06 was 79.26%,
# floored to 79 — DRIFTED BELOW the §10 Handoffs table's "80%" snapshot
# (2026-09-09). Per this card's instructions: still committed as a
# baseline-only ratchet (no new tests written here, out of this card's
# scope) rather than blocking the batch, but flagged explicitly — see the
# card's delivery comment. remote_host_cli_app/shell.py at 35.86% is the
# main drag; a small follow-up there would clear 80% again. May only rise.
fail_under = 79
